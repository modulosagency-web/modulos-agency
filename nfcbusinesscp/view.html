<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Business Profile</title>
<link rel="icon" href="/nfcbusinesscp/assets/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0f172a;background:radial-gradient(900px 500px at 10% -10%,#c7d2fe,transparent 60%),radial-gradient(800px 500px at 100% 110%,#ddd6fe,transparent 55%),#f4f6fb;min-height:100vh;display:flex;justify-content:center;padding:24px 16px 40px;-webkit-text-size-adjust:100%}
.wrap{width:100%;max-width:460px}
.card{background:#fff;border-radius:26px;box-shadow:0 2px 4px rgba(15,23,42,.05),0 20px 50px rgba(79,70,229,.15);overflow:hidden}
.cover{height:96px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.body{padding:0 24px 26px;text-align:center}
.logo{position:relative;width:104px;height:104px;border-radius:26px;margin:-52px auto 14px;background:#fff;border:4px solid #fff;box-shadow:0 8px 24px rgba(15,23,42,.18);display:grid;place-items:center;overflow:hidden;font-size:40px;font-weight:800;color:#4f46e5;background:linear-gradient(135deg,#e0e7ff,#ede9fe)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
h1{font-size:25px;margin:0 0 8px;line-height:1.2;word-break:break-word}
.desc{color:#475569;margin:0 0 22px;line-height:1.6;white-space:pre-line;word-break:break-word}
.links{display:flex;flex-direction:column;gap:11px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;text-decoration:none;color:#0f172a;background:#f6f7fc;border:1px solid #e5e9f2;font-weight:600;transition:.15s;text-align:left}
.link:hover{transform:translateY(-1px);border-color:#c7d2fe;background:#eef0ff}
.link .i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.link small{display:block;font-weight:400;color:#64748b}
.wa .i{background:#25d366}.ig .i{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}.fb .i{background:#1877f2}.yt .i{background:#ff0000}.gr .i{background:#fbbc04}.lc .i{background:#ea4335}
.share{margin-top:18px;background:transparent;border:0;color:#4f46e5;font:inherit;font-weight:600;cursor:pointer;padding:8px}
.state{text-align:center;padding:48px 28px}
.state .big{font-size:46px}
.state h1{font-size:21px;margin-top:10px}.state p{color:#64748b;margin:8px 0 0}
.spinner{width:42px;height:42px;border:4px solid #dfe3f3;border-top-color:#4f46e5;border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
footer{text-align:center;color:#94a3b8;font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><div class="state"><div class="spinner"></div><p>Loading business…</p></div></div>
  <footer>Powered by MODULOS NFC</footer>
</div>
<script type="module">
import { db, configured } from "/nfcbusinesscp/js/firebase.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const card = document.getElementById("card");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safe = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };

function stateView(icon, title, text) {
  card.innerHTML = `<div class="state"><div class="big">${icon}</div><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

function getId() {
  const m = location.pathname.match(/(\d{4,9})\/?$/);
  const id = m ? m[1] : (new URLSearchParams(location.search).get("id") || location.hash.slice(1));
  return /^\d{4,9}$/.test(id || "") ? id : null;
}

async function main() {
  if (!configured) return stateView("⚙️", "Not configured", "This page is not connected to Firebase yet.");
  const id = getId();
  if (!id) return stateView("🔎", "Invalid business link", "The Card ID in this link is missing or not valid.");
  try {
    const st = await get(ref(db, "status/" + id));
    if (!st.exists()) return stateView("🚫", "Business not found", "This business page does not exist or has been removed.");
    if (st.val().active !== true) return stateView("⏸️", "Currently unavailable", "This business page is temporarily inactive. Please check back later.");
    const snap = await get(ref(db, "businesses/" + id));
    if (!snap.exists()) return stateView("🚫", "Business not found", "This business page does not exist or has been removed.");
    render(snap.val());
  } catch (e) {
    console.error(e);
    stateView("⚠️", "Could not load page", "Please check your internet connection and try again.");
  }
}

function render(b) {
  document.title = `${b.name} - Business Profile`;
  const wa = b.whatsapp ? `https://wa.me/${String(b.whatsapp).replace(/\D/g, "")}` : "";
  const loc = b.location ? (safe(b.location) || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.location)}`) : "";
  const items = [
    ["wa", "💬", "WhatsApp", b.whatsapp ? "+" + b.whatsapp : "", wa],
    ["ig", "📸", "Instagram", "Follow us", safe(b.instagram)],
    ["fb", "👍", "Facebook", "Like our page", safe(b.facebook)],
    ["yt", "▶", "YouTube", "Watch our videos", safe(b.youtube)],
    ["gr", "⭐", "Google Review", "Rate your experience", safe(b.googleReview)],
    ["lc", "📍", "Location", b.location && !safe(b.location) ? b.location : "Open in maps", loc]
  ].filter(i => i[4]);
  const logo = safe(b.logo);
  card.innerHTML = `<div class="cover"></div><div class="body">
    <div class="logo">${esc((b.name || "?").trim()[0]?.toUpperCase() || "?")}${logo ? `<img src="${esc(logo)}" alt="${esc(b.name)} logo" referrerpolicy="no-referrer">` : ""}</div>
    <h1>${esc(b.name)}</h1>
    ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
    <div class="links">${items.map(([c, ic, t, sub, href]) => `<a class="link ${c}" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="i">${ic}</span><span>${t}${sub ? `<small>${esc(sub)}</small>` : ""}</span></a>`).join("") || '<p class="desc">No contact links have been added yet.</p>'}</div>
    <button class="share" id="shareBtn" type="button">Share this page</button></div>`;
  card.querySelector(".logo img")?.addEventListener("error", e => e.target.remove());
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const data = { title: b.name, text: b.name, url: location.href };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert("Link copied"); } } catch { }
  });
}
main();
</script>
</body>
</html>
