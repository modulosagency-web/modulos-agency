name = "modulos-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
# After `wrangler deploy`, attach custom domain api.modulos.in to this Worker (Cloudflare dashboard > Workers > Triggers).

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # wrangler kv namespace create KV

[vars]            # NOT secrets - safe to keep here
ALLOWED_ORIGIN = "https://modulos.in"
SITE_URL = "https://modulos.in"
GH_OWNER = "YOUR_GITHUB_USERNAME"
GH_REPO = "YOUR_REPO_NAME"
GH_BRANCH = "main"
# Secrets (set with `wrangler secret put NAME`): GH_TOKEN, SETUP_KEY
